name: Frontend CI

# Deploys are owned by Vercel's native Git integration (auto-deploys every push
# to main + preview builds on PRs), so this workflow only validates the build.
# The old amondnet/vercel-action deploy/preview jobs were a redundant second
# deploy path and were removed.

on:
  push:
    branches: [main, develop]
    paths:
      - 'cg-v1.110.26/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cg-v1.110.26/frontend/**'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cg-v1.110.26/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The project uses pnpm (packageManager: pnpm@9.15.0, pnpm-lock.yaml,
      # vercel.json installCommand: pnpm install). Version is read from the root
      # package.json "packageManager" field — do NOT also set `version:` here or
      # action-setup errors with "Multiple versions of pnpm specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint || echo "::warning::ESLint found issues"
        continue-on-error: true

      - name: Run TypeScript type checking
        run: pnpm exec tsc --noEmit || echo "::warning::TypeScript found type errors"
        continue-on-error: true

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: https://api.find-commonground.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful!"
            ls -lah .next
          else
            echo "❌ Build failed - no .next directory"
            exit 1
          fi
