<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline · CommonGround</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #F4F8F7 0%, #E8F4F0 100%);
      color: #1E3A4A;
      display: flex; align-items: center; justify-content: center;
      padding: calc(env(safe-area-inset-top, 0) + 24px) 24px calc(env(safe-area-inset-bottom, 0) + 24px);
      -webkit-tap-highlight-color: transparent;
    }
    .card { max-width: 360px; text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #5b7280; line-height: 1.5; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #3DAA8A; color: #fff; font-weight: 600; font-size: 16px;
      padding: 14px 24px; border-radius: 9999px; touch-action: manipulation;
    }
    button:active { background: #34977a; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="120" fill="#FFFFFF"/>
      <circle cx="168" cy="148" r="48" fill="#3DAA8A"/>
      <circle cx="344" cy="148" r="48" fill="#2D6A8F"/>
      <circle cx="256" cy="330" r="38" fill="#F5A623"/>
    </svg>
    <h1>You're offline</h1>
    <p>CommonGround needs a connection for this. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
