{# CommonGround Email Styles — Brand-aligned inline CSS for email clients #}
<style type="text/css">
  /* Reset */
  body, table, td, p, a, li, blockquote {
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
  }
  table, td {
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
  }
  img {
    -ms-interpolation-mode: bicubic;
    border: 0;
    height: auto;
    line-height: 100%;
    outline: none;
    text-decoration: none;
  }

  /* Base — Brand: DM Sans, Soft White background */
  body {
    margin: 0 !important;
    padding: 0 !important;
    background-color: #F4F8F7;
    font-family: 'DM Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #1E3A4A;
  }

  /* Container */
  .email-container {
    max-width: 600px;
    margin: 0 auto;
    background-color: #FFFFFF;
  }

  /* Header Variants — Brand gradients */
  .header-sage {
    background: linear-gradient(135deg, #3DAA8A 0%, #5BC4A0 100%);
  }
  .header-slate {
    background: linear-gradient(135deg, #2D6A8F 0%, #4BA8C8 100%);
  }
  .header-amber {
    background: linear-gradient(135deg, #F5A623 0%, #F7BD5E 100%);
  }
  .header-navy {
    background: linear-gradient(135deg, #1E3A4A 0%, #2D6A8F 100%);
  }

  /* Typography — DM Sans family */
  h1 {
    font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #1E3A4A;
    margin: 0 0 16px 0;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }
  h2 {
    font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #1E3A4A;
    margin: 0 0 12px 0;
  }
  h3 {
    font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #1E3A4A;
    margin: 0 0 8px 0;
  }
  p {
    margin: 0 0 16px 0;
    color: #1E3A4A;
  }
  .text-secondary {
    color: #4A6B7A;
  }
  .text-muted {
    color: #8CA0A8;
    font-size: 14px;
  }
  .text-sage {
    color: #3DAA8A;
  }
  .text-amber {
    color: #F5A623;
  }
  .text-slate {
    color: #2D6A8F;
  }
  .text-center {
    text-align: center;
  }

  /* Buttons — Brand primary teal */
  .btn {
    display: inline-block;
    padding: 14px 32px;
    font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 10px;
    text-align: center;
    letter-spacing: 0.2px;
  }
  .btn-primary {
    background-color: #3DAA8A;
    color: #FFFFFF !important;
  }
  .btn-secondary {
    background-color: #2D6A8F;
    color: #FFFFFF !important;
  }
  .btn-amber {
    background-color: #F5A623;
    color: #FFFFFF !important;
  }
  .btn-navy {
    background-color: #1E3A4A;
    color: #FFFFFF !important;
  }
  .btn-outline {
    background-color: transparent;
    border: 2px solid #3DAA8A;
    color: #3DAA8A !important;
  }

  /* Cards — Clean, subtle */
  .card {
    background-color: #F4F8F7;
    border: 1px solid #D6ECE8;
    border-radius: 12px;
    padding: 24px;
    margin: 16px 0;
  }
  .card-highlight {
    background-color: #E8F4F0;
    border-color: #3DAA8A;
  }
  .card-warning {
    background-color: #FEF7ED;
    border-color: #F5A623;
  }
  .card-info {
    background-color: #E0EFF8;
    border-color: #2D6A8F;
  }

  /* Feature List */
  .feature-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .feature-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 12px;
    padding: 8px 0;
  }
  .feature-icon {
    width: 24px;
    height: 24px;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .divider {
    height: 1px;
    background-color: #D6ECE8;
    margin: 24px 0;
  }

  .footer {
    background-color: #F4F8F7;
    padding: 24px 32px;
    text-align: center;
  }
  .footer p {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: #6B8F80;
  }
  .footer a {
    color: #3DAA8A;
    text-decoration: underline;
  }

  /* Utilities */
  .mb-0 { margin-bottom: 0; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .p-16 { padding: 16px; }
  .p-24 { padding: 24px; }
  .p-32 { padding: 32px; }

  /* Expiry / Alert Notice */
  .expiry-notice {
    background-color: #FEF7ED;
    border-left: 4px solid #F5A623;
    padding: 12px 16px;
    font-size: 14px;
    color: #4A6B7A;
    margin: 16px 0;
    border-radius: 0 8px 8px 0;
  }

  /* Stats Grid */
  .stats-grid {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .stat-item {
    text-align: center;
    padding: 16px;
    background-color: #F4F8F7;
    border-radius: 10px;
    flex: 1;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: #3DAA8A;
    display: block;
  }
  .stat-label {
    font-size: 11px;
    color: #6B8F80;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  /* Responsive */
  @media only screen and (max-width: 600px) {
    .email-container {
      width: 100% !important;
    }
    .p-32 {
      padding: 20px !important;
    }
    h1 {
      font-size: 22px !important;
    }
    .stats-grid {
      flex-direction: column;
    }
  }
</style>
